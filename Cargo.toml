[package]
name = "craft-signing-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host-neutral signing provider contracts for Craft apps"

[lib]
path = "src/lib.rs"

[target.'cfg(target_os = "windows")'.dependencies]
rustls-cng = { version = "0.7.1", default-features = false }
sha2 = "0.10"

[build-dependencies]
cc = "1.2"
