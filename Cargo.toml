[package]
name = "craft-signing-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host-neutral signing provider contracts for Craft apps"

[lib]
path = "src/lib.rs"

[target.'cfg(target_os = "windows")'.dependencies]
rustls-cng = { version = "0.7.1", default-features = false }
# Pure Rust signed-module CMS/X.509 verification. All MIT OR Apache-2.0.
cms = { version = "0.2.3", default-features = false, features = ["std"] }
directories = "6"
getrandom = "0.4"
der = { version = "0.7.10" }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
sha2 = "0.10"
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
roxmltree = "0.20.0"

[build-dependencies]
cc = '1.2'

[dev-dependencies]
tempfile = "3.27"
