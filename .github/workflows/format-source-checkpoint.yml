name: One-shot Rust source formatting checkpoint
on:
  push:
    branches: [feature/shared-signing-windows-opc-ci-20261020]
    paths: ['.github/workflows/format-source-checkpoint.yml']
permissions:
  contents: write
jobs:
  rustfmt-once:
    if: github.repository == 'Yanakiev432/craft-signing-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: rustfmt
      - name: Format only tracked Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --name-only > /tmp/format-paths
          while IFS= read -r path; do
            case "$path" in
              src/*.rs) ;;
              *) echo "UNEXPECTED_FORMAT_CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/format-paths
          git diff --check
          if [ ! -s /tmp/format-paths ]; then
            echo 'NO_FORMAT_CHANGES=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src
          git commit -m 'style(signing-core): apply rustfmt to reviewed Rust contract sources'
          git push origin HEAD:feature/shared-signing-windows-opc-ci-20261020
          echo 'RUSTFMT_COMMIT_PUSHED=PASS'
