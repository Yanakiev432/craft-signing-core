name: Native Win32 OPC in-process signing and verification
on:
  push:
    branches:
      - feature/native-opc-inprocess-20261021
  pull_request:
    paths:
      - 'native/opc_native.cpp'
      - 'src/opc_native.rs'
      - 'build.rs'
      - 'tools/test_native_opc_inprocess.ps1'
      - 'examples/opc_native_*.rs'
      - '.github/workflows/native-opc-inprocess.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-opc:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build genuine in-process Win32 OPC COM adapter
        run: cargo test --all-targets
      - name: Produce test binaries
        run: cargo build --examples
      - name: Reject any shell/child process in native implementation
        shell: pwsh
        run: |
          $source=(Get-Content 'native/opc_native.cpp' -Raw)+(Get-Content 'src/opc_native.rs' -Raw)
          foreach($blocked in @('powershell.exe','cmd.exe','std::process::Command','CreateProcessW(','ShellExecuteW(','WinExec(')){
            if($source.Contains($blocked)){throw ('NATIVE_OPC_SHELL_NO_GO: '+$blocked)}
          }
          Write-Host 'INPROCESS_NO_SHELL_PROCESS=PASS'
      - name: Native signer + independently verified DOCX and XLSX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:RUNNER_TEMP ('craft-native-opc-'+[Guid]::NewGuid().ToString('N'))
          & ./tools/test_native_opc_inprocess.ps1 -OutputDirectory $path
          if($LASTEXITCODE -ne 0){throw 'native acceptance failed'}
          Write-Host 'BTRUST_USB=NOT_USED; USER_PIN=NOT_REQUESTED; QES=NOT_VERIFIED'
  platform-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Shared core remains portable
        run: cargo test --lib
